name: muster
version: 1.0.0
description: >-
  See what your AI helpers are actually doing. Every worker hermes starts shows
  up live in one pane: working, stuck (silent too long), failing on repeat, or
  gone (hermes crashed). Stop a stuck one or send it a message with one click.
  Start your own helpers with muster_fanout. No network, no setup, no deps.
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.5"
license: MIT
homepage: https://github.com/jollyroger1480/muster
tags: [delegation, subagents, observability, desktop, kanban, fleet]
python_dependencies: []
config_schema:
  stall_seconds:
    type: int
    default: 300
    label: When to call a worker "stuck" (seconds)
    description: >-
      If a worker has been silent this long, muster flags it as stuck.
      300 = 5 minutes.
  spin_threshold:
    type: int
    default: 3
    label: Repeat-failure alarm
    description: If the same job fails this many times, muster flags it as
      "failing on repeat".
  spin_window_seconds:
    type: int
    default: 1800
    label: Repeat-failure window (seconds)
    description: How far back to count repeat failures (default 30 minutes).
  show_goals:
    type: bool
    default: true
    label: Show what each worker is doing
    description: Show each worker's job description in the pane. Turn off if
      you share your screen.
  board_rows:
    type: int
    default: 120
    label: Board rows
    description: How many workers to show in the pane and /muster.
  chip_enabled:
    type: bool
    default: true
    label: Show status-bar chip
    description: The little "muster · 2 working · 1 stuck" counter at the
      bottom of the Desktop app.
capabilities: []
provides_tools:
  - muster_fanout
  - muster_status
provides_hooks:
  - subagent_start
  - subagent_stop
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_auxiliary_call
  - post_auxiliary_call
  - on_session_finalize
  - kanban_task_claimed
  - kanban_task_completed
  - kanban_task_blocked
  - on_kanban_worker_exited
requires_env: []
